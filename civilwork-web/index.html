<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d16">
  <meta name="description" content="ARCHILAB CIVILWORK — calculateur parasismique RPA 2024 et BAEL 91 dans le navigateur, compilé en WebAssembly.">
  <title>ARCHILAB CIVILWORK — RPA 2024 / BAEL 91</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1726'/%3E%3Cpath d='M14 50V26l10-8 10 8v24M34 50V32l8-6 8 6v18' fill='none' stroke='%23f0a33c' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #080d16; color: #e8eef8; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: radial-gradient(circle at 50% 30%, #131d30, #080d16 65%); z-index: 2;
      transition: opacity .35s ease; pointer-events: none;
    }
    #boot .mark { width: 44px; height: 44px; border: 2px solid #f0a33c; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    #boot p { margin: 0; color: #93a4bd; letter-spacing: 1px; font-size: 12px; text-transform: uppercase; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="mark"></div><p>Chargement de Civilwork…</p></div>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (boot) { boot.style.opacity = '0'; setTimeout(function () { boot.remove(); }, 400); }
      }, 900);
    });
  </script>
  <script src="archilab-civilwork.js"></script>
</body>
</html>
