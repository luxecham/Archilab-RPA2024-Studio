name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin 21 - tests BAEL/RPA
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executer les tests
        shell: bash
        run: ./gradlew test --console=plain

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Python - tests parsers et note
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python_app
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_app/requirements.txt

      - name: Installer les dependances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Executer les tests
        run: python -m unittest discover -s tests -v
