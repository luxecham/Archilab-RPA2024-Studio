name: Deploy ARCHILAB CIVILWORK AG to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer JDK 21 pour Civilwork Wasm
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler Civilwork en WebAssembly
        run: ./gradlew -p civilwork-web wasmJsBrowserDistribution --console=plain --no-daemon

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Ajouter la page Civilwork Wasm
        run: |
          set -euo pipefail
          mkdir -p dist/civilwork-wasm
          cp -R civilwork-web/build/dist/wasmJs/productionExecutable/. dist/civilwork-wasm/
          cp civilwork-web/index.html dist/civilwork-wasm/index.html
          test -f dist/civilwork-wasm/archilab-civilwork.js
          test -f dist/civilwork-wasm/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
